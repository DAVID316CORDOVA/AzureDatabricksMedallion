resources:
  pipelines:
    bronze_medallion_bundle:
      name: bronze_medallion_bundle
      catalog: ${var.catalog}
      target: ${var.bronze_schema}
      serverless: true
      development: ${var.pipeline_development}
      libraries:
        - file:
            path: ../notebooks/bronze_medallion_dlt.py

  jobs:
    medallion_full_pipeline:
      name: medallion_full_pipeline
      schedule:
        quartz_cron_expression: "0 0 13 2 8 ? *"
        timezone_id: "America/Bogota"

      environments:
        - environment_key: serverless_env
          spec:
            client: "1"
            dependencies:
              - dbt-core
              - dbt-databricks

      tasks:
        - task_key: run_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_medallion_bundle.id}

        - task_key: run_dbt
          depends_on:
            - task_key: run_bronze
          environment_key: serverless_env
          dbt_task:
            project_directory: ../medallion_dbt
            warehouse_id: a8fd1c152b89c33b
            catalog: ${var.catalog}
            schema: silver
            commands:
              - "dbt deps"
              - "dbt build --vars '{bronze_schema: ${var.bronze_schema}, silver_schema: ${var.silver_schema}, gold_schema: ${var.gold_schema}}'"

      email_notifications:
        on_failure:
          - felix.david.cordova.garcia@gmail.com
        on_success:
          - felix.david.cordova.garcia@gmail.com
