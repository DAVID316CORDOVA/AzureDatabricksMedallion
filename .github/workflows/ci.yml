# Name of the workflow, shown in the GitHub Actions tab
name: CI - Validate in dev

# Trigger: run this workflow whenever a Pull Request targeting "main" is opened or updated
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    # Use a fresh Ubuntu virtual machine for this job
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: https://adb-7405611969133544.4.azuredatabricks.net
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}

    steps:
      # Step 1: download the repository code onto this fresh machine
      - uses: actions/checkout@v4

      # Step 2: install the Databricks CLI, needed for "bundle" commands
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      # Step 3: deploy both the pipeline and the job definitions to the dev environment
      - name: Deploy bundle to dev
        run: databricks bundle deploy -t dev --auto-approve

      # Step 4: run the full orchestrated job (bronze pipeline + dbt build)
      # This is the same job that runs in production, so CI now tests the
      # real end-to-end flow instead of testing bronze and dbt separately
      - name: Run full medallion job in dev
        run: databricks bundle run medallion_full_pipeline -t dev

      # Step 5: if any step above failed, post an alert to the team Slack channel
      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"CI failed on PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
